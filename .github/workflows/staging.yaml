name: Feature Branch Lint

on:
  push:
    branches:
      - 'feature/*'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  # Use the Node version your project needs

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          echo "Installing root dependencies..."
          npm install
          echo "Root dependencies installed successfully"

      # 4. Run lint
      - name: Run Lint On Backend
        run: |
          echo "Changing to Backend directory..."
          cd Backend
          echo "Current directory: $(pwd)"
          echo "Installing Backend dependencies..."
          npm install
          echo "Backend dependencies installed successfully"
          echo "Running Backend lint..."
          npm run lint
          echo "Backend lint completed successfully"

      - name: Run Lint On Frontend
        run: |
          echo "Changing to Frontend directory..."
          cd Frontend/Frontend
          echo "Current directory: $(pwd)"
          echo "Installing Frontend dependencies..."
          npm install
          echo "Frontend dependencies installed successfully"
          echo "Running Frontend lint..."
          npm run lint
          echo "Frontend lint completed successfully"

      