name: Feature Branches Checks

on:
  push: 
    branches:
      - 'feature/*'

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run lint checks
        uses: super-linter/super-linter@v8.2.0 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: "true"

