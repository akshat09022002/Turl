name: Staging Checks

on:
  pull_request:
    branches:
      - staging

  push: 
    branches:
      - staging

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1   # shallow clone is enough

      - name: Run lint checks
        uses: super-linter/super-linter@v8.2.0
        env:
          DEFAULT_BRANCH: staging
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
